# Validation retry after repository rename.
# Reusable workflow repository renamed to tamura09/pr-review.
# 人間が作った PR を Claude がレビューする。
#
# 実体は再利用可能ワークフローに切り出してある。
#   https://github.com/tamura09/pr-review
#
# マージはしない。以前は Renovate の PR だけ renovate-auto-review.yml が自動で
# マージしていたが、あれを動かすために OIDC の信頼ポリシーが全リポジトリの
# main を開ける必要があったので、やめた (tamura09/aws-terraform#285)。
#
# Renovate の PR はここでもレビューしない。切り出し先の既定の skip_authors に
# tamura09-renovate[bot] が入っているので、このファイルには何も書かなくてよい。
# 他のリポジトリと同じ扱いで、マージは人が判断する。
name: PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# 呼び出される側の permissions は呼び出し側を超えられないため、ここで明示する
permissions:
  contents: read
  pull-requests: write
  issues: write
  # claude-review チェックを PR のチェック一覧に出すため
  statuses: write
  # OAuth トークンを SSM から読むための OIDC トークン発行
  id-token: write
  # CI の実行結果を Claude に読ませるため (github_ci MCP に必要)
  actions: read

# 連続 push のたびに走らせず、最新のコミットだけレビューする
concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    uses: tamura09/pr-review/.github/workflows/pr-review.yml@dab16d103f3af9b9f69f795c05f43a28eefdbe78 # v1
