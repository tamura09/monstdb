# 人間が作った PR を Claude がレビューする。
#
# 実体は再利用可能ワークフローに切り出してある。
#   https://github.com/tamura09/claude-pr-review
#
# マージはしない。自動マージは Renovate の PR に限定していて、そちらは
# .github/workflows/renovate-auto-review.yml が担当する。
#
# Renovate の PR はここではレビューしない。renovate-auto-review.yml と合わせて
# Claude が二重に走るため。切り出し先の既定の skip_authors に
# tamura09-renovate[bot] が入っているので、このファイルには何も書かなくてよい。
name: PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# 呼び出される側の permissions は呼び出し側を超えられないため、ここで明示する
permissions:
  contents: read
  pull-requests: write
  issues: write
  # claude-review チェックを PR のチェック一覧に出すため
  statuses: write
  # OAuth トークンを SSM から読むための OIDC トークン発行
  id-token: write

# 連続 push のたびに走らせず、最新のコミットだけレビューする
concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    uses: tamura09/claude-pr-review/.github/workflows/pr-review.yml@v1
