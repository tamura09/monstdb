# Dependabotによる依存関係の自動更新設定
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2

updates:
  # ── アプリ本体 (npm) ──────────────────────────────────────────────
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
    groups:
      # マイナー/パッチはまとめて1つのPRにする。
      # メジャーはグループに入れず個別PRのままにして、破壊的変更を1つずつ
      # レビューできるようにする(Next.js・React・Prisma・Zod等)。
      prod-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      dev-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

  # ── GitHub Actions ───────────────────────────────────────────────
  # 更新頻度が低いので月次。まとめて1つのPRにする。
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      timezone: Asia/Tokyo
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions:
        patterns:
          - "*"

  # ── Terraform (infra/) ───────────────────────────────────────────
  # 注意: terraform-plan.yml は infra/** の変更で pull_request 時に走るが、
  # Dependabotが作成したPRのワークフローはリポジトリのSecretsにアクセスできず、
  # AWSのOIDCロール引き受けにも失敗するため、planジョブは失敗する。
  # planを通したい場合は Settings > Secrets and variables > Dependabot に
  # 必要な値を登録するか、terraform-plan.yml 側で
  # `if: github.actor != 'dependabot[bot]'` によりスキップする。
  # (planが落ちてもDependabotのPR自体は差分の確認・マージに支障はない)
  - package-ecosystem: terraform
    directory: "/infra"
    schedule:
      interval: monthly
      timezone: Asia/Tokyo
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
      - terraform
