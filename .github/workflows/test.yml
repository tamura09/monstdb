name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  # Vercelのビルド環境(Node 24)とローカル開発環境(.nvmrc)に合わせる
  NODE_VERSION: "24"

jobs:
  # DBを必要としない静的チェック。テストジョブと並行して走る。
  lint-and-typecheck:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # tsc / eslint は generated/prisma の型を参照するため、
      # 型チェックの前に必ず Prisma Client を生成する。
      - name: Generate Prisma Client
        run: npx prisma generate

      # TypeScript公式のside-by-side構成により、tsc は TypeScript 7 (Go実装)。
      # typescript パッケージ本体は @typescript/typescript6 のままで、
      # TS7 が未提供のJS APIを必要とする typescript-eslint と
      # next build の型チェックがそちらを使う (詳細は README を参照)。
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  test:
    runs-on: ubuntu-26.04-arm

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: monstdb_test
        ports:
          - 5432:5432
        # コンテナが受付可能になるまでジョブの開始を待たせる
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # CI用のローカルサービスコンテナを指す。本番の接続情報は絶対に使わない。
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/monstdb_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/monstdb_test
      # セッションJWTの署名にのみ使うCI専用のダミー値。
      # 本番の NEXTAUTH_SECRET とは無関係であり、秘密情報ではない。
      NEXTAUTH_SECRET: ci-dummy-secret-not-used-in-production
      # lib/auth.ts の GoogleProvider が非空を要求するためのダミー値。
      # テストは NextAuth の JWT を直接生成するため OAuth 通信は発生しない。
      GOOGLE_CLIENT_ID: ci-dummy-client-id
      GOOGLE_CLIENT_SECRET: ci-dummy-client-secret

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Push schema to test database
        run: npx prisma db push

      # キャラクターマスター・わくわくの実マスターを投入する。
      # 統合テストはこれらのマスターを参照のみ行い、作成はしない。
      - name: Seed master data
        run: npm run seed

      # ユニットテスト + 統合テスト。
      # 統合テストは vitest の globalSetup が next dev を起動し、
      # 実際にHTTPリクエストを投げて検証する。
      - name: Run tests
        run: npm run test
